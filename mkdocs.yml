site_name: LHD Data
repo_url: https://github.com/queezz/lhd-data
strict: true
theme:
  name: material
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  palette:
    - scheme: bh-dark
      primary: custom
      accent: yellow
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: amber
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
markdown_extensions:
  - admonition
  - toc:
      permalink: true
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
  - mkdocs-jupyter
nav:
  - Home: index.md
  - CLI: cli.md
  - Data View: data-view.md
  - API: reference.md
extra_css:
  - styles/brand.css
  - styles/extra.css

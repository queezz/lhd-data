site_name: LHD Data
repo_url: https://github.com/queezz/lhd-data
strict: true
theme:
  name: material
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
markdown_extensions:
  - admonition
  - toc:
      permalink: true
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
  - mkdocs-jupyter
nav:
  - Home: index.md
  - API: reference.md
extra_css:
  - styles/brand.css
  - styles/extra.css
